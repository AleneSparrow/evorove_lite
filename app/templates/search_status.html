<div id="search-status" role="status" hx-get="/app/search-status" hx-trigger="every 5s" hx-swap="outerHTML">{% if not last %}<span>No search has run yet.</span>{% elif last.status == 'running' %}<span>Searching&hellip;</span>{% elif last.status == 'failed' %}<span>Last search failed &mdash; try again.</span>{% else %}<span>Last search: found {{ last.found }} &middot; {{ last.started_at|relative_time }}</span>{% endif %}</div>
